[package]
name = "unpayload"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Extract partition images from Android OTA payloads, full and incremental"
license = "MIT"
repository = "https://github.com/kirklin/unpayload"
keywords = ["android", "ota", "payload", "firmware", "extract"]
categories = ["compression", "filesystem"]

[dependencies]
brotli-decompressor = "6.1"
bzip2 = "0.6"
liblzma = { version = "0.4", features = ["static"] }
prost = "0.14"
rayon = "1.12"
sha2 = "0.11"
thiserror = "2"
zstd = "0.14"

[dev-dependencies]
tempfile = "3"
